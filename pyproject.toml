[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-monitor"
version = "0.1.0"
description = "Monitor CLI asíncrono de telemetría para Triton Cloud Services"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app_operator"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88